name: Zhest KZ Video Processor

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Direct media URL. Leave empty for text-only test."
        required: false
        type: string
      title:
        description: "Headline/title"
        required: true
        default: "Тест ЖЕСТЬ KZ"
        type: string
      text:
        description: "Optional body for text-only card"
        required: false
        type: string
      job_id:
        description: "Queue job id"
        required: false
        default: "manual-test"
        type: string
      callback_url:
        description: "Optional Cloudflare callback URL"
        required: false
        type: string

  repository_dispatch:
    types: [zhestkz-video]

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WHISPER_MODEL: base
      PROCESSOR_KEY: ${{ secrets.VIDEO_PROCESSOR_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve event inputs
        shell: bash
        env:
          D_MEDIA_URL: ${{ github.event.client_payload.media_url }}
          D_TITLE: ${{ github.event.client_payload.title }}
          D_TEXT: ${{ github.event.client_payload.text }}
          D_JOB_ID: ${{ github.event.client_payload.job_id }}
          D_CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          W_MEDIA_URL: ${{ inputs.media_url }}
          W_TITLE: ${{ inputs.title }}
          W_TEXT: ${{ inputs.text }}
          W_JOB_ID: ${{ inputs.job_id }}
          W_CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def choose(a, b, default=""):
              return os.getenv(a) or os.getenv(b) or default

          vals = {
              "MEDIA_URL": choose("D_MEDIA_URL", "W_MEDIA_URL"),
              "TITLE": choose("D_TITLE", "W_TITLE", "Тест ЖЕСТЬ KZ"),
              "TEXT": choose("D_TEXT", "W_TEXT"),
              "JOB_ID": choose("D_JOB_ID", "W_JOB_ID", "manual-test"),
              "CALLBACK_URL": choose("D_CALLBACK_URL", "W_CALLBACK_URL"),
          }

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as f:
              for key, value in vals.items():
                  marker = f"EOF_{key}"
                  f.write(f"{key}<<{marker}\n{value}\n{marker}\n")
          PY

      - name: Process media
        run: python src/processor.py

      - name: Validate TikTok output
        run: |
          test -s output/zhestkz_tiktok.mp4
          python - <<'PY'
          import json
          import subprocess

          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,codec_name",
              "-of", "json", "output/zhestkz_tiktok.mp4"
          ], text=True)
          stream = json.loads(raw)["streams"][0]
          assert stream["width"] == 1080 and stream["height"] == 1920, stream
          assert stream["codec_name"] == "h264", stream
          print("VALID:", stream)
          PY

      - name: Upload processed video
        uses: actions/upload-artifact@v4
        with:
          name: zhestkz-video-${{ env.JOB_ID }}
          path: |
            output/zhestkz_tiktok.mp4
            output/result.json
          retention-days: 3
          if-no-files-found: error
